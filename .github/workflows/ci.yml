name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code -- support_agent/web/app.css
      - run: python -m pip install -e '.[knowledge,mcp,oidc]'
      - run: python -m unittest discover -s tests -v
      - run: docker build -t customer-agent:ci .
      - run: docker run --rm customer-agent:ci python -m support_agent.cli --help
