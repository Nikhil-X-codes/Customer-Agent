[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-agent"
version = "0.1.0"
description = "Grounded customer support agent with explicit handoff rules"
requires-python = ">=3.10"

[project.scripts]
customer-agent = "support_agent.cli:main"

[tool.setuptools.packages.find]
include = ["support_agent*"]
