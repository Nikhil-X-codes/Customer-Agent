# Reference deployment behind a company TLS/auth gateway. Set real values in .env.
services:
  agent:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      APP_MODE: production
      AGENT_DOMAIN: supply_chain
      HANDOFF_DB_PATH: /app/var/handoffs.db
      EMBEDDING_CACHE_PATH: /app/var/model-cache
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - agent_state:/app/var
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).close()"]
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 30s
volumes:
  agent_state:
